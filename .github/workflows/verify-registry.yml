name: Verify registry profiles

on:
  push:
    paths:
      - ".reg/**"
      - "index.html"
      - "README.md"
      - "tools/verify_registry.py"
      - ".github/workflows/verify-registry.yml"
  pull_request:
    paths:
      - ".reg/**"
      - "index.html"
      - "README.md"
      - "tools/verify_registry.py"
      - ".github/workflows/verify-registry.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate scope, TZI data and published hashes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Registry profiles
        run: python3 tools/verify_registry.py
