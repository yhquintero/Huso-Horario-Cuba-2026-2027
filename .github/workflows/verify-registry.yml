name: Verify timezone configuration

on:
  push:
    paths:
      - ".reg/**"
      - ".ps1/**"
      - "index.html"
      - "script.js"
      - "styles.css"
      - "README.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - "tools/verify_registry.py"
      - ".github/workflows/verify-registry.yml"
  pull_request:
    paths:
      - ".reg/**"
      - ".ps1/**"
      - "index.html"
      - "script.js"
      - "styles.css"
      - "README.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - "tools/verify_registry.py"
      - ".github/workflows/verify-registry.yml"

permissions:
  contents: read

jobs:
  validate-data:
    name: Validate scope, TZI data and published hashes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Registry files and app consistency
        run: python3 tools/verify_registry.py
      - name: Check local SHA-256 verifier JavaScript syntax
        run: node --check script.js

  parse-powershell:
    name: Parse app with Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse script without executing it
        shell: powershell
        run: |
          $scriptPath = Join-Path $PWD ".ps1\CubaHora2027.ps1"
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List * | Out-String | Write-Host
            exit 1
          }
          Write-Host "PowerShell syntax parsed successfully; script was not executed."
