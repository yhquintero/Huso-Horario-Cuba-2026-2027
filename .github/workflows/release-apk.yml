name: Publish Android release

# Una release se publica empujando un tag con el formato vX.Y.Z que coincida con
# versionName de android/app/build.gradle. El APK que se adjunta es el que ya
# está versionado en dist/ (verificado en el flujo Build Android APK), así que
# este flujo no recompila: solo comprueba y publica.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify the published APK matches this tag
        run: |
          set -euo pipefail
          python3 tools/verify_android.py
          python3 tools/verify_release_hashes.py
          (cd dist && sha256sum -c SHA256SUMS)
          version="$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle | head -1)"
          echo "versionName=$version tag=${GITHUB_REF_NAME}"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash android/scripts/publish-release.sh
