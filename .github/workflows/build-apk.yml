name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - "assets/**"
      - "index.html"
      - "script.js"
      - "styles.css"
      - "tools/build_android_site.py"
      - "tools/render_screens.py"
      - "docs/capturas/**"
      - "tools/verify_android.py"
      - "tools/publish_dist.py"
      - "tools/verify_release_hashes.py"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "assets/**"
      - "index.html"
      - "script.js"
      - "styles.css"
      - "tools/build_android_site.py"
      - "tools/render_screens.py"
      - "docs/capturas/**"
      - "tools/verify_android.py"
      - "tools/publish_dist.py"
      - "tools/verify_release_hashes.py"
      - "dist/**"
      - ".github/workflows/build-apk.yml"
  # La publicación de una release se hace con .github/workflows/release-apk.yml
  # al empujar un tag vX.Y.Z.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"

jobs:
  static-checks:
    name: Static checks (rule, manifest, guide)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Registry profiles (unchanged Windows side)
        run: python3 tools/verify_registry.py
      - name: Verify Android project consistency
        run: python3 tools/verify_android.py
      - name: Verify committed APK checksums
        if: hashFiles('dist/SHA256SUMS') != ''
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Verify APK checksums match the published table
        run: python3 tools/verify_release_hashes.py --check

  build-apk:
    name: Build APK
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5

      - name: Build release APK
        run: |
          set -o pipefail
          bash android/scripts/build-apk.sh 2>&1 | tee /tmp/build.log

      - name: Verify APK and publish checksums in dist/
        run: |
          set -o pipefail
          bash android/scripts/verify-apk.sh 2>&1 | tee /tmp/verify.log

      - name: Show APK summary
        run: |
          ls -l dist/
          cat dist/SHA256SUMS
          sed -n '1,12p' dist/README.md

      - name: Commit dist/ back to the branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash android/scripts/commit-dist.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.3
        with:
          name: cuba-hora-2027-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS
            dist/README.md
          if-no-files-found: error
          retention-days: 30

      - name: Report failure details
        if: failure()
        run: |
          python3 - <<'PY_ANNOTATE'
          import pathlib

          def emit(line):
              text = line.replace("%", "%25").replace("\r", "%0D")
              print("::error::" + text[:900])

          # El bloque «What went wrong» es donde Gradle explica la causa real.
          for name in ("/tmp/build.log", "/tmp/verify.log"):
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              for index, line in enumerate(lines):
                  if "What went wrong" in line:
                      emit("--- %s: bloque de error ---" % path.name)
                      for detail in lines[index:index + 18]:
                          emit(detail)
                      break
          PY_ANNOTATE
          echo "::group::dependencias resueltas"
          find ~/.gradle/caches/modules-2/files-2.1 -maxdepth 2 -type d 2>/dev/null | grep -iE "shizuku|annotation" | head -10
          for aar in $(find ~/.gradle/caches -name "*.aar" 2>/dev/null | head -5); do
            echo "== $aar"
            unzip -l "$aar" | head -15
          done
          df -h / | tail -2
          echo "::endgroup::"
          python3 - <<'PY_ANNOTATE2'
          import pathlib

          for name in ("/tmp/verify.log", "/tmp/build.log"):
              log = pathlib.Path(name)
              if not log.is_file():
                  continue
              lines = log.read_text(encoding="utf-8", errors="replace").splitlines()
              patterns = (".java:", "ERROR", "error", "FAIL", "Traceback",
                          "Caused by", "What went wrong", "Execution failed",
                          "> Task", "Could not", "Cannot", "firma", "Signer",
                          "Verified using")
              hits = [line for line in lines
                      if any(pattern in line for pattern in patterns)]
              # La causa suele estar tras «What went wrong»: se muestran las
              # últimas coincidencias, no las primeras del log.
              selected = hits[-40:] if hits else lines[-40:]
              if selected:
                  print("::error::---- %s ----" % name)
              for line in selected:
                  if line.strip():
                      emit(line)
              break
          PY_ANNOTATE
