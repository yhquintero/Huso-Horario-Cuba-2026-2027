name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - "assets/**"
      - "index.html"
      - "script.js"
      - "styles.css"
      - "tools/build_android_site.py"
      - "tools/verify_android.py"
      - "tools/publish_dist.py"
      - "tools/verify_release_hashes.py"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "assets/**"
      - "index.html"
      - "script.js"
      - "styles.css"
      - "tools/build_android_site.py"
      - "tools/verify_android.py"
      - "tools/publish_dist.py"
      - "tools/verify_release_hashes.py"
      - "dist/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar el APK como release de GitHub"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"

jobs:
  static-checks:
    name: Static checks (rule, manifest, guide)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Registry profiles (unchanged Windows side)
        run: python3 tools/verify_registry.py
      - name: Verify Android project consistency
        run: python3 tools/verify_android.py
      - name: Verify committed APK checksums
        if: hashFiles('dist/SHA256SUMS') != ''
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Verify APK checksums match the published table
        run: python3 tools/verify_release_hashes.py --check

  build-apk:
    name: Build APK
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5

      - name: Build release APK
        run: |
          set -o pipefail
          bash android/scripts/build-apk.sh 2>&1 | tee /tmp/build.log

      - name: Verify APK and publish checksums in dist/
        run: |
          set -o pipefail
          bash android/scripts/verify-apk.sh 2>&1 | tee /tmp/verify.log

      - name: Show APK summary
        run: |
          ls -l dist/
          cat dist/SHA256SUMS
          sed -n '1,12p' dist/README.md

      - name: Commit dist/ back to the branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash android/scripts/commit-dist.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.3
        with:
          name: cuba-hora-2027-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS
            dist/README.md
          if-no-files-found: error
          retention-days: 30

      - name: Report failure details
        if: failure()
        run: |
          python3 - <<'PY_ANNOTATE'
          import pathlib

          def emit(line):
              text = line.replace("%", "%25").replace("\r", "%0D")
              print("::error::" + text[:900])

          for name in ("/tmp/verify.log", "/tmp/build.log"):
              log = pathlib.Path(name)
              if not log.is_file():
                  continue
              lines = log.read_text(encoding="utf-8", errors="replace").splitlines()
              hits = [line for line in lines
                      if ".java:" in line or "ERROR" in line or "error" in line
                      or "FAIL" in line or "Traceback" in line
                      or "firma" in line or line.startswith("Signer")
                      or "Verified using" in line]
              selected = hits[:30] if hits else lines[-30:]
              if selected:
                  print("::error::---- %s ----" % name)
              for line in selected:
                  if line.strip():
                      emit(line)
              break
          PY_ANNOTATE

  publish-release:
    name: Publish GitHub release
    needs: build-apk
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.2.1
        with:
          name: cuba-hora-2027-apk
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash android/scripts/publish-release.sh
